version: "3.8"

services:
  db:
    image: postgres:16
    container_name: fakturka-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fakturka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fakturka"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fakturka-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=fakturka;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7010:8080"

  web:
    build:
      context: frontend-web
      dockerfile: Dockerfile
    container_name: fakturka-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:7010"

volumes:
  pgdata:
